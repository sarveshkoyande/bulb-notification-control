name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Secrets are not available in step-level `if:`, so surface them as env first.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      TUYA_SECURITY_IMAGE_BASE64: ${{ secrets.TUYA_SECURITY_IMAGE_BASE64 }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    # Restore the fixed signing key. The Tuya App SDK authenticates against the
    # SHA256 of this certificate, so it must be identical on every build.
    - name: Restore signing keystore
      if: env.KEYSTORE_BASE64 != ''
      run: |
        mkdir -p _secrets
        echo "$KEYSTORE_BASE64" | base64 -d > _secrets/bulb.keystore
        echo "Keystore restored ($(stat -c%s _secrets/bulb.keystore) bytes)"

    # Tuya security image, required in assets/ by the App SDK.
    - name: Restore Tuya security image
      if: env.TUYA_SECURITY_IMAGE_BASE64 != ''
      run: |
        mkdir -p app/src/main/assets
        echo "$TUYA_SECURITY_IMAGE_BASE64" | base64 -d > app/src/main/assets/t_s.bmp
        echo "Security image restored ($(stat -c%s app/src/main/assets/t_s.bmp) bytes)"

    - name: Build debug APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        TUYA_APP_KEY: ${{ secrets.TUYA_APP_KEY }}
        TUYA_APP_SECRET: ${{ secrets.TUYA_APP_SECRET }}
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Show signing certificate fingerprint
      run: |
        APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
        echo "APK: $APK"
        unzip -p "$APK" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -E "SHA1:|SHA256:" || echo "(could not read cert)"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
