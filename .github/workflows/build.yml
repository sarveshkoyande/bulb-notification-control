name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Secrets are not available in step-level `if:`, so surface them as env first.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      # The 175 KB security-algorithm AAR exceeds GitHub's 48 KB per-secret limit,
      # so it is stored base64-split across 6 secrets and reassembled here. This
      # keeps Tuya's app-specific licensed binary out of the public repo.
      AAR_B64_0: ${{ secrets.AAR_B64_0 }}
      AAR_B64_1: ${{ secrets.AAR_B64_1 }}
      AAR_B64_2: ${{ secrets.AAR_B64_2 }}
      AAR_B64_3: ${{ secrets.AAR_B64_3 }}
      AAR_B64_4: ${{ secrets.AAR_B64_4 }}
      AAR_B64_5: ${{ secrets.AAR_B64_5 }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    # Restore the fixed signing key. The Tuya App SDK authenticates against the
    # SHA256 of this certificate, so it must be identical on every build.
    - name: Restore signing keystore
      if: env.KEYSTORE_BASE64 != ''
      run: |
        mkdir -p _secrets
        echo "$KEYSTORE_BASE64" | base64 -d > _secrets/bulb.keystore
        echo "Keystore restored ($(stat -c%s _secrets/bulb.keystore) bytes)"

    # SDK 7.8.0 replaces the old t_s.bmp image with an app-specific
    # security-algorithm AAR. Its README requires that t_s.bmp NOT be present.
    - name: Restore security-algorithm AAR
      if: env.AAR_B64_0 != ''
      run: |
        mkdir -p app/libs
        printf '%s' "$AAR_B64_0$AAR_B64_1$AAR_B64_2$AAR_B64_3$AAR_B64_4$AAR_B64_5" \
          | tr -d '\r\n \t' | base64 -d > app/libs/security-algorithm-1.0.0-beta.aar || true
        SZ=$(stat -c%s app/libs/security-algorithm-1.0.0-beta.aar 2>/dev/null || echo 0)
        MD5=$(md5sum app/libs/security-algorithm-1.0.0-beta.aar 2>/dev/null | cut -d' ' -f1)
        echo "AAR restored: $SZ bytes, md5=$MD5"
        if [ "$MD5" != "576aeff687a5db9d59188c6d225c095c" ]; then
          echo "::error::AAR CORRUPT — got $SZ bytes md5=$MD5, expected 175909 bytes md5=576aeff687a5db9d59188c6d225c095c. A secret part is truncated or has stray characters."
          rm -f app/libs/security-algorithm-1.0.0-beta.aar
        else
          echo "AAR verified OK"
        fi

    - name: Check SDK security files
      run: |
        if ls app/libs/security-algorithm-*.aar >/dev/null 2>&1; then
          echo "security-algorithm AAR present:"; ls -la app/libs/
        else
          echo "::warning::No security-algorithm AAR — Thing SDK auth will fail at runtime with 'illegal client' (build still proceeds)."
        fi
        # SDK 7.8.0 uses the AAR; the legacy t_s.bmp must NOT be present.
        if find . -name t_s.bmp -not -path './_sdk/*' | grep -q .; then
          echo "::error::t_s.bmp must not exist when using the security-algorithm AAR"; exit 1
        fi

    - name: Build debug APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        TUYA_APP_KEY: ${{ secrets.TUYA_APP_KEY }}
        TUYA_APP_SECRET: ${{ secrets.TUYA_APP_SECRET }}
      run: |
        set +e
        gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        STATUS=${PIPESTATUS[0]}
        if [ "$STATUS" -ne 0 ]; then
          # Surface the real cause as annotations (CI logs need auth to read).
          grep -E "FAILURE:|Execution failed|error:|Caused by:|Duplicate class|^> |Could not (resolve|find)|AAPT|Manifest merger" build.log \
            | grep -v "^\s*$" | head -25 \
            | while IFS= read -r line; do echo "::error::${line:0:400}"; done
          echo "::error::Gradle exited with status $STATUS"
        fi
        exit $STATUS

    - name: Show signing certificate fingerprint
      run: |
        APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
        echo "APK: $APK"
        unzip -p "$APK" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -E "SHA1:|SHA256:" || echo "(could not read cert)"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
